[pytest]
testpaths = tests
# The workstation image ships ROS 2 pytest plugins that raise at import time.
# Run the suite with:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest
# (Windows: set PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 && python -m pytest)
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
